name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main is checked by the deploy workflow

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Shadow database for checking that migrations match schema.prisma.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: shadow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/shadow
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx tsc --noEmit
      - run: bunx prisma validate
      - name: Migrations match schema.prisma
        run: >-
          bunx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "$DATABASE_URL"
          --exit-code
      - run: bun run build
