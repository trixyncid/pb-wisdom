# Local development in Docker. Not for the VPS (that is docker-compose.prod.yml).
#
#   bun run docker:up      start Postgres + the dev server -> http://localhost:3000
#                          (hot reload: edit files, no rebuild, no new images)
#   bun run docker:seed    load the demo club data (wipes the database)
#   bun run docker:reset   empty database, migrations, demo data
#   bun run docker:prod    optional: build and run the production image on :3001
#   bun run docker:clean   remove leftover images and build cache
#   bun run docker:down    stop (data is kept in the pgdata volume)

name: pb-wisdom-local

x-database-url: &database-url
  DATABASE_URL: postgresql://pbwisdom:pbwisdom@db:5432/pbwisdom?schema=public

x-app-env: &app-env
  <<: *database-url
  AUTH_SECRET: local-docker-secret-change-me-0123456789
  CRON_SECRET: local-cron-secret
  AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
  AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pbwisdom
      POSTGRES_PASSWORD: pbwisdom
      POSTGRES_DB: pbwisdom
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 5433 on the host: 5432 is often taken by a locally installed Postgres.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pbwisdom -d pbwisdom"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Dev server with hot reload. The image (Node + bun) is built once; the
  # source is mounted, so saving a file updates the app without a rebuild.
  # node_modules and .next live in volumes: Linux binaries (Prisma, sharp)
  # differ from the Mac's, and the host's own builds stay separate.
  dev:
    build:
      context: .
      target: dev
    image: pb-wisdom:dev
    command: ["sh", "-c", "bun install --frozen-lockfile && bunx prisma migrate deploy && bun run dev"]
    environment:
      <<: *app-env
      AUTH_URL: http://localhost:3000
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # ---- optional production image check (`bun run docker:prod`) ----
  migrate:
    profiles: [prod]
    image: pb-wisdom:local
    command: ["prisma", "migrate", "deploy"]
    environment: *database-url
    depends_on:
      db:
        condition: service_healthy

  app:
    profiles: [prod]
    image: pb-wisdom:local
    build:
      context: .
      args:
        DEPLOYMENT_ID: local
    environment:
      <<: *app-env
      AUTH_URL: http://localhost:3001
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  node_modules:
  next_cache:
